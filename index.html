    <title>ڤايب كود عربي | Vibe Coding بالعربي لغير المبرمجين</title>
    <!-- Safe fetch getter/setter protection -->
    <script>
      (function() {
        try {
          var origFetch = window.fetch;
          if (origFetch) {
            var _currentFetch = origFetch;
            Object.defineProperty(window, 'fetch', {
              get: function() { return _currentFetch; },
              set: function(fn) { _currentFetch = fn; },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {
          // Ignore if property is already non-configurable
        }
      })();
    </script>
